<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE MOON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; color: #fff; }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }

    #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; pointer-events: none; }

    #title {
      position: absolute;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2vw, 1rem);
      color: rgba(200, 220, 255, 0.5);
    }

    #big-text {
      position: absolute;
      bottom: 6rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }
    #big-text h1 {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 100;
      letter-spacing: 0.3em;
      color: rgba(220, 235, 255, 0.9);
      text-shadow: 0 0 60px rgba(150, 180, 255, 0.4), 0 0 120px rgba(100, 150, 255, 0.2);
    }
    #big-text p {
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      letter-spacing: 0.4em;
      color: rgba(180, 200, 255, 0.35);
      margin-top: 0.5rem;
    }

    #phase {
      position: absolute;
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
      text-align: right;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(180, 200, 255, 0.3);
      line-height: 2.2;
    }

    #dist {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(180,200,255,0.25);
      line-height: 2;
    }

    #drag-hint {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(180,200,255,0.2);
    }
  </style>
</head>
<body>
<div id="ui">
  <div id="title">Earth's Only Natural Satellite</div>

  <div id="big-text">
    <h1>MOON</h1>
    <p>384,400 km from Earth · 3,474 km diameter</p>
  </div>

  <div id="phase">
    WAXING GIBBOUS<br>
    ILLUMINATION 78%<br>
    AGE 10.4 DAYS<br>
    RISE 14:32<br>
    SET 03:11
  </div>

  <div id="dist">
    DISTANCE · 384,400 KM<br>
    GRAVITY · 1.62 M/S²<br>
    ORBIT · 27.3 DAYS<br>
    TEMP · −173 TO 127°C
  </div>

  <div id="drag-hint">drag to rotate</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.6, 0.9);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.enableZoom = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;

// ── Stars ──────────────────────────────────────────────
const starVerts = [];
for (let i = 0; i < 6000; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 500 + Math.random() * 300;
  starVerts.push(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xddeeff, size: 0.8, sizeAttenuation: true })));

// ── Moon surface procedural texture ───────────────────
function makeMoonTexture(size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // base colour
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0,   '#d8dde8');
  grad.addColorStop(0.5, '#b0b8c8');
  grad.addColorStop(1,   '#8890a0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // noise
  for (let i = 0; i < 60000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = Math.random() * 2;
    const v = Math.random() > 0.5 ? 255 : 0;
    ctx.fillStyle = `rgba(${v},${v},${v},0.025)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // craters
  const craters = [
    { x: 0.3, y: 0.35, r: 0.09 }, { x: 0.65, y: 0.55, r: 0.07 },
    { x: 0.5,  y: 0.2,  r: 0.05 }, { x: 0.2,  y: 0.65, r: 0.06 },
    { x: 0.75, y: 0.3,  r: 0.04 }, { x: 0.4,  y: 0.7,  r: 0.035 },
    { x: 0.6,  y: 0.75, r: 0.025 },{ x: 0.15, y: 0.4,  r: 0.03 },
    { x: 0.8,  y: 0.6,  r: 0.02 }, { x: 0.55, y: 0.45, r: 0.015 },
  ];
  craters.forEach(c => {
    const cx = c.x * size, cy = c.y * size, cr = c.r * size;
    // shadow ring
    const g = ctx.createRadialGradient(cx, cy, cr * 0.7, cx, cy, cr * 1.1);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.35)');
    g.addColorStop(1, 'rgba(255,255,255,0.15)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, cr * 1.1, 0, Math.PI * 2); ctx.fill();
    // inner floor
    const gf = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 0.7);
    gf.addColorStop(0, 'rgba(180,185,200,0.6)');
    gf.addColorStop(1, 'rgba(120,125,140,0.2)');
    ctx.fillStyle = gf;
    ctx.beginPath(); ctx.arc(cx, cy, cr * 0.7, 0, Math.PI * 2); ctx.fill();
  });

  // mare (dark regions)
  [
    { x: 0.45, y: 0.48, rx: 0.22, ry: 0.15 },
    { x: 0.6,  y: 0.3,  rx: 0.1,  ry: 0.08 },
    { x: 0.25, y: 0.55, rx: 0.08, ry: 0.06 },
  ].forEach(m => {
    const g = ctx.createRadialGradient(m.x*size, m.y*size, 0, m.x*size, m.y*size, m.rx*size);
    g.addColorStop(0, 'rgba(60,65,80,0.3)');
    g.addColorStop(1, 'rgba(60,65,80,0)');
    ctx.fillStyle = g;
    ctx.save();
    ctx.translate(m.x*size, m.y*size);
    ctx.scale(1, m.ry/m.rx);
    ctx.beginPath(); ctx.arc(0, 0, m.rx*size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  return new THREE.CanvasTexture(canvas);
}

function makeMoonNormal(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#8080ff';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 20000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = Math.random() * 3;
    ctx.fillStyle = `rgba(${80 + Math.random()*60},${80 + Math.random()*60},255,0.15)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(canvas);
}

const moonTex    = makeMoonTexture(1024);
const normalTex  = makeMoonNormal(512);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.8, 128, 128),
  new THREE.MeshStandardMaterial({
    map: moonTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.6, 0.6),
    roughness: 0.95,
    metalness: 0.0,
  })
);
scene.add(moon);

// atmosphere haze
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(1.87, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0x8899bb,
    transparent: true,
    opacity: 0.04,
    side: THREE.BackSide,
  })
);
scene.add(atmo);

// ── Sunlight ───────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xfff5e8, 2.5);
sun.position.set(8, 3, 5);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223366, 0.15));

// soft fill from dark side
const fill = new THREE.DirectionalLight(0x334488, 0.08);
fill.position.set(-5, -2, -3);
scene.add(fill);

// ── Resize ──────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ── Animate ─────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  moon.rotation.y = t * 0.02;
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
