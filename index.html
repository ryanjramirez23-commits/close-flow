<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Universe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      pointer-events: auto;
    }

    #hero h1 {
      font-size: clamp(2rem, 6vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(167,139,250,0.8));
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 20px rgba(167,139,250,0.5)); }
      to   { filter: drop-shadow(0 0 60px rgba(96,165,250,0.9)); }
    }

    #hero p {
      margin-top: 1rem;
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    #hero .btn {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.8em 2.5em;
      border: 2px solid rgba(167,139,250,0.7);
      border-radius: 50px;
      color: #a78bfa;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(167,139,250,0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    #hero .btn:hover {
      background: rgba(167,139,250,0.3);
      box-shadow: 0 0 30px rgba(167,139,250,0.5);
      transform: scale(1.05);
    }

    #nav {
      position: absolute;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      pointer-events: auto;
    }
    #nav a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    #nav a:hover { color: #a78bfa; }

    #scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(-8px); }
    }

    #info-panel {
      position: absolute;
      bottom: 5rem;
      right: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      line-height: 1.8;
      text-align: right;
    }
  </style>
</head>
<body>
<div id="ui">
  <nav id="nav">
    <a href="#">Explore</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div id="hero">
    <h1>Universe</h1>
    <p>Drift through infinity</p>
    <div class="btn" id="enterBtn">Enter the void</div>
  </div>

  <div id="scroll-hint">scroll or drag to explore ↓</div>

  <div id="info-panel">
    <div>Move mouse to look around</div>
    <div>Scroll to zoom</div>
    <div>Click objects to interact</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// Scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000010, 0.015);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// Post-processing bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.85);
composer.addPass(bloom);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ── Stars ──────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starCount = 8000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 600;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

// ── Central glowing orb ────────────────────────────────
const coreGeo = new THREE.SphereGeometry(3, 64, 64);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0x6030ff,
  emissive: 0x4020cc,
  emissiveIntensity: 2,
  roughness: 0,
  metalness: 0.5,
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Outer glow shell
const glowGeo = new THREE.SphereGeometry(3.3, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x8060ff, transparent: true, opacity: 0.15, side: THREE.BackSide });
scene.add(new THREE.Mesh(glowGeo, glowMat));

// ── Rings ──────────────────────────────────────────────
function makeRing(innerR, outerR, color, tiltX = 0, tiltZ = 0) {
  const geo = new THREE.RingGeometry(innerR, outerR, 128);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = tiltX;
  mesh.rotation.z = tiltZ;
  scene.add(mesh);
  return mesh;
}
const ring1 = makeRing(5, 5.4, 0xa78bfa, Math.PI / 2, 0.2);
const ring2 = makeRing(7, 7.2, 0x60a5fa, Math.PI / 2 + 0.4, -0.3);
const ring3 = makeRing(9, 9.1, 0x34d399, Math.PI / 2 - 0.3, 0.5);

// ── Orbiting planets ───────────────────────────────────
const planets = [];
const planetData = [
  { radius: 0.8, orbit: 12, speed: 0.4,  color: 0xf472b6, emissive: 0xaa3066, y: 1 },
  { radius: 1.2, orbit: 17, speed: 0.25, color: 0x60a5fa, emissive: 0x1060aa, y: -2 },
  { radius: 0.5, orbit: 22, speed: 0.55, color: 0x34d399, emissive: 0x0a8060, y: 3 },
  { radius: 1.0, orbit: 28, speed: 0.15, color: 0xfbbf24, emissive: 0xaa7010, y: 0 },
];

planetData.forEach(d => {
  const geo = new THREE.SphereGeometry(d.radius, 32, 32);
  const mat = new THREE.MeshStandardMaterial({
    color: d.color,
    emissive: d.emissive,
    emissiveIntensity: 1.5,
    roughness: 0.3,
    metalness: 0.4,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  planets.push({ mesh, ...d, angle: Math.random() * Math.PI * 2 });

  // Orbit trail
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * d.orbit, d.y, Math.sin(a) * d.orbit));
  }
  const trail = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: 0.15 })
  );
  scene.add(trail);
});

// ── Floating crystals ──────────────────────────────────
const crystals = [];
for (let i = 0; i < 40; i++) {
  const geo = new THREE.OctahedronGeometry(Math.random() * 0.4 + 0.2);
  const hue = Math.random();
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue, 1, 0.6),
    emissive: new THREE.Color().setHSL(hue, 1, 0.3),
    emissiveIntensity: 2,
    roughness: 0,
    metalness: 1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 10 + Math.random() * 25;
  mesh.position.setFromSphericalCoords(r, phi, theta);
  mesh.userData.spin = (Math.random() - 0.5) * 0.03;
  mesh.userData.float = Math.random() * Math.PI * 2;
  scene.add(mesh);
  crystals.push(mesh);
}

// ── Lights ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x111133, 2));
const pt1 = new THREE.PointLight(0x8060ff, 5, 50);
scene.add(pt1);
const pt2 = new THREE.PointLight(0xff60a0, 3, 40);
pt2.position.set(15, 10, 0);
scene.add(pt2);
const pt3 = new THREE.PointLight(0x60ffcc, 3, 40);
pt3.position.set(-15, -10, 0);
scene.add(pt3);

// ── Raycaster for click interaction ───────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickables = [core, ...planets.map(p => p.mesh), ...crystals];

renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables);
  if (hits.length) {
    const obj = hits[0].object;
    // pulse scale
    obj.userData.pulse = 1;
  }
});

// ── Enter button ───────────────────────────────────────
document.getElementById('enterBtn').addEventListener('click', () => {
  controls.autoRotateSpeed = 2;
  setTimeout(() => { controls.autoRotateSpeed = 0.3; }, 3000);
  bloom.strength = 3;
  setTimeout(() => { bloom.strength = 1.5; }, 2000);
});

// ── Resize ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ── Animate ────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Core pulse
  const s = 1 + Math.sin(t * 2) * 0.03;
  core.scale.setScalar(s);
  coreMat.emissiveIntensity = 1.8 + Math.sin(t * 1.5) * 0.5;

  // Rings slow drift
  ring1.rotation.z = t * 0.1;
  ring2.rotation.z = -t * 0.07;
  ring3.rotation.z = t * 0.05;

  // Planets orbit
  planets.forEach(p => {
    p.angle += p.speed * 0.01;
    p.mesh.position.set(
      Math.cos(p.angle) * p.orbit,
      p.y + Math.sin(t * 0.5 + p.angle) * 0.5,
      Math.sin(p.angle) * p.orbit
    );
    p.mesh.rotation.y += 0.02;
  });

  // Crystals float & spin
  crystals.forEach(c => {
    c.rotation.y += c.userData.spin;
    c.rotation.x += c.userData.spin * 0.7;
    c.position.y += Math.sin(t + c.userData.float) * 0.005;

    if (c.userData.pulse) {
      c.scale.setScalar(1 + c.userData.pulse * 0.5);
      c.userData.pulse *= 0.9;
      if (c.userData.pulse < 0.01) c.userData.pulse = 0;
    }
  });

  // Core click pulse
  if (core.userData.pulse) {
    core.scale.setScalar(s + core.userData.pulse * 0.8);
    core.userData.pulse *= 0.92;
    if (core.userData.pulse < 0.01) core.userData.pulse = 0;
  }

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
